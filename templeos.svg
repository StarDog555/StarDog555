<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 640x480 VGA 16-color vibe: blue background, yellow / white / cyan text -->
  <rect width="720" height="300" fill="#0000aa"/>
  <rect x="0" y="0" width="720" height="26" fill="#aaaaaa"/>
  <text x="10" y="19" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#000000">TempleOS  -  In loving memory</text>
  <text x="600" y="19" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#000000">[X]</text>

  <g font-family="'Courier New', monospace" font-size="20" font-weight="700">
    <text x="24" y="70" fill="#ffff55" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="0.3s" fill="freeze"/>
      Terry A. Davis
    </text>
    <text x="24" y="104" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="1.2s" fill="freeze"/>
      1969 - 2018
    </text>
    <text x="24" y="150" fill="#55ffff" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="2.2s" fill="freeze"/>
      An OS, a compiler, a language, a game,
    </text>
    <text x="24" y="178" fill="#55ffff" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="3.2s" fill="freeze"/>
      all written by one person, from scratch.
    </text>
    <text x="24" y="224" fill="#55ff55" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="4.4s" fill="freeze"/>
      Thank you for the inspiration. Rest in peace.
    </text>
    <text x="24" y="266" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;0;1" dur="0.01s" begin="5.4s" fill="freeze"/>
      C:/Home&gt;<tspan fill="#ffff55">
        <animate attributeName="opacity" values="1;0;1" dur="1s" begin="5.4s" repeatCount="indefinite"/>_</tspan>
    </text>
  </g>

  <rect x="1" y="1" width="718" height="298" fill="none" stroke="#aaaaaa" stroke-width="2"/>
</svg>
