<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="0.6" stop-color="#1b0638"/>
      <stop offset="1" stop-color="#4c1190"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="sunclip"><rect x="0" y="0" width="1000" height="215"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="320" rx="26" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="80" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.1;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="90" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="30" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="45" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="95" r="1.3"><animate attributeName="opacity" values="1;0.1;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="35" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sun with scanline cuts -->
  <g clip-path="url(#sunclip)">
    <circle cx="500" cy="205" r="120" fill="url(#sun)" filter="url(#glow)" opacity="0.95"/>
    <g fill="#1b0638">
      <rect x="360" y="150" width="280" height="4"/>
      <rect x="360" y="168" width="280" height="6"/>
      <rect x="360" y="186" width="280" height="8"/>
      <rect x="360" y="204" width="280" height="10"/>
    </g>
  </g>

  <!-- horizon + grid floor -->
  <rect x="0" y="215" width="1000" height="105" fill="#12042a"/>
  <line x1="0" y1="215" x2="1000" y2="215" stroke="#e879f9" stroke-width="2" filter="url(#glow)"/>
  <g stroke="#a855f7" stroke-width="1.2" opacity="0.8">
    <line x1="500" y1="215" x2="-300" y2="320"/><line x1="500" y1="215" x2="-60" y2="320"/>
    <line x1="500" y1="215" x2="140" y2="320"/><line x1="500" y1="215" x2="320" y2="320"/>
    <line x1="500" y1="215" x2="500" y2="320"/><line x1="500" y1="215" x2="680" y2="320"/>
    <line x1="500" y1="215" x2="860" y2="320"/><line x1="500" y1="215" x2="1060" y2="320"/>
    <line x1="500" y1="215" x2="1300" y2="320"/>
    <line x1="0" y1="232" x2="1000" y2="232"/><line x1="0" y1="256" x2="1000" y2="256"/>
    <line x1="0" y1="288" x2="1000" y2="288"/>
    <line x1="0" y1="215" x2="1000" y2="215">
      <animate attributeName="y1" values="215;232;215" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="215;232;215" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- glitch title: cyan + pink ghosts, white on top -->
  <g font-family="'Courier New', monospace" font-weight="900" font-size="82" text-anchor="middle">
    <text x="494" y="128" fill="#22d3ee" opacity="0.7">
      <animate attributeName="x" values="494;506;490;494;494;500;494" dur="3s" repeatCount="indefinite"/>
      CODE FOR FUN
    </text>
    <text x="506" y="132" fill="#f43f5e" opacity="0.7">
      <animate attributeName="x" values="506;492;510;506;506;498;506" dur="3s" repeatCount="indefinite"/>
      CODE FOR FUN
    </text>
    <text x="500" y="130" fill="url(#txt)" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;0.85;1;1;0.9;1" dur="4s" repeatCount="indefinite"/>
      CODE FOR FUN
    </text>
  </g>
  <text x="500" y="168" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#e9d5ff" letter-spacing="8">C  ·  TYPESCRIPT  ·  PURPLE</text>

  <!-- moving scanline -->
  <rect x="0" y="0" width="1000" height="3" fill="#ffffff" opacity="0.08">
    <animate attributeName="y" values="0;320;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="2" y="2" width="996" height="316" rx="24" fill="none" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/>
</svg>
